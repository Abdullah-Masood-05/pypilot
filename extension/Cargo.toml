[package]
name = "pypilot-zed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Zed shim for PyPilot. Downloads the helper binary for your platform and registers it as a Python language server."

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# The only dependency the shim needs. Everything else lives in the native helper.
zed_extension_api = "0.7.0"
