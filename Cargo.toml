# PyPilot Cargo workspace.
#
# Two members:
#   * `helper`: native binary (`pypilot`); the editor-agnostic brain.
#   * `extension`: Zed WASM shim (cdylib). Built for the `wasm32-*` target only,
#                   so it is intentionally NOT part of the default workspace build
#                   set that CI runs `cargo test` over. It is still a workspace
#                   member so `cargo build -p pypilot-zed --target wasm32-unknown-unknown`
#                   resolves against the shared lockfile.
[workspace]
resolver = "2"
members = ["helper", "extension"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/Abdullah-Masood-05/pypilot"
authors = ["PyPilot contributors"]

[profile.release]
# The shim is downloaded per-platform; keep it small and strip symbols.
strip = true
lto = "thin"
opt-level = "z"
