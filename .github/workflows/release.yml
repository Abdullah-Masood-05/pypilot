name: Release

# Publishes the native helper binaries as GitHub release assets, named exactly as
# the WASM shim expects: pypilot-<slug>.tar.gz (unix) / pypilot-windows-x64.zip.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach assets to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.slug }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { slug: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: tar.gz }
          # macos-13 (Intel) hosted-runner capacity has been withdrawn and jobs
          # pinned to it queue indefinitely rather than fail. macos-14 is Apple
          # Silicon hardware, but its toolchain cross-links x86_64-apple-darwin
          # natively, so the produced binary is unchanged, only the build host is.
          - { slug: darwin-x64, os: macos-14, target: x86_64-apple-darwin, ext: tar.gz }
          - { slug: darwin-arm64, os: macos-14, target: aarch64-apple-darwin, ext: tar.gz }
          - { slug: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build -p pypilot-helper --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          tar czf "pypilot-${{ matrix.slug }}.tar.gz" -C "target/${{ matrix.target }}/release" pypilot

      - name: Package (windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/pypilot.exe" -DestinationPath "pypilot-${{ matrix.slug }}.zip"

      - name: Upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: pypilot-${{ matrix.slug }}.${{ matrix.ext }}
          fail_on_unmatched_files: true
